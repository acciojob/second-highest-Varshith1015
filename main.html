	<script>
		function secondHighest(arr) {
			//Write your code here
			if(arr.length<2){
				return -Infinity;
			}
			let largest=Math.max(arr[0],arr[1]);
			let slargest=Math.min(arr[0],arr[1]);
			
			
			for(let i=2;i<arr.length;i++){
				if(arr[i]>=slargest && arr[i]<largest){
					slargest=arr[i];
				}
				if(arr[i]>=largest){
					slargest=largest;
					largest=arr[i];
				}
			}
			if(largest===slargest){
				return -Infinity;
			}
			return slargest;
		}

		function Main() {
			var n = prompt("Enter the number of elements");
			var arr = [];
			for (var i = 0; i < n; i++) {
				arr[i] = prompt("Enter element " + (i+1));
			}

			
		}
		//Main();
	</script>
